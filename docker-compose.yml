services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-case_management}
      POSTGRES_USER: ${POSTGRES_USER:-case_management}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-case_management_dev}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-case_management} -d ${POSTGRES_DB:-case_management}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://case_management:case_management_dev@postgres:5432/case_management}
      JWT_SECRET: ${JWT_SECRET:-development-only-secret}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build: ./apps/web
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_healthy}
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
  minio_data:
